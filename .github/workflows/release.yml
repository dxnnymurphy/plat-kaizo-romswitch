name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: plat-kaizo-romswitch
            asset_name: plat-kaizo-romswitch-linux-x64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: plat-kaizo-romswitch
            asset_name: plat-kaizo-romswitch-linux-arm64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: plat-kaizo-romswitch
            asset_name: plat-kaizo-romswitch-macos-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: plat-kaizo-romswitch
            asset_name: plat-kaizo-romswitch-macos-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: plat-kaizo-romswitch.exe
            asset_name: plat-kaizo-romswitch-windows-x64.exe

    steps:
      - uses: actions/checkout@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}