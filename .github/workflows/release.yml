name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: plat-kaizo-romswitch
            asset_name: plat-kaizo-romswitch-linux-x64
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: plat-kaizo-romswitch
            asset_name: plat-kaizo-romswitch-linux-arm64
            use_cross: true

          - os: ubuntu-latest
            target: aarch64-linux-android
            artifact_name: plat-kaizo-romswitch
            asset_name: plat-kaizo-romswitch-android-arm64
            use_cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: plat-kaizo-romswitch
            asset_name: plat-kaizo-romswitch-macos-x64
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: plat-kaizo-romswitch
            asset_name: plat-kaizo-romswitch-macos-arm64
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: plat-kaizo-romswitch.exe
            asset_name: plat-kaizo-romswitch-windows-x64.exe
            use_cross: false

    steps:
      - uses: actions/checkout@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
              CROSS_TARGET_AARCH64_LINUX_ANDROID_IMAGE=ghcr.io/cross-rs/aarch64-linux-android:main cross build --release --target ${{ matrix.target }}
            else
              cross build --release --target ${{ matrix.target }}
            fi
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare release asset
        run: cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} target/${{ matrix.target }}/release/${{ matrix.asset_name }}
        shell: bash

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}